<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat con personaje</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Cabecera: nombre del personaje y navegación -->
    <header class="app-header">
      <div class="character">
        <div class="avatar" aria-hidden="true">?</div>
        <div>
          <h1 class="character-name">Nombre del personaje</h1>
          <p class="character-status">en línea</p>
        </div>
      </div>
      <nav class="nav" aria-label="Navegación principal">
        <a href="/home" class="nav-link" data-link>Home</a>
        <a href="/chat" class="nav-link" data-link>Chat</a>
        <a href="/about" class="nav-link" data-link>About</a>
      </nav>
    </header>

    <!-- Acá el router (app.js) renderiza la vista según la URL -->
    <main id="app"></main>

    <footer class="app-footer">
      <small>Proyecto Integrador 3 · ComicSansCon</small>
    </footer>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
